# Local development dependencies. Application containers are added in Phase 16.
name: fareride

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: fareride
      POSTGRES_PASSWORD: fareride
      POSTGRES_DB: fareride
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fareride -d fareride']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
